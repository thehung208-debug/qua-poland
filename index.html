<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sổ Quà Ba Lan</title>
  <!-- Google Fonts: Plus Jakarta Sans (UI/UX Pro Max Standard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            sage: {
              DEFAULT: '#9CAF88',
              50: '#F4F7F2',
              100: '#E7EDE3',
              200: '#D2DEC9',
              300: '#B8CBAC',
              400: '#9CAF88',
              500: '#7E936A',
              600: '#637553',
              700: '#4A573E',
              800: '#343E2C',
              900: '#20261B',
              950: '#141811',
            },
            offwhite: {
              DEFAULT: '#F7F5EF',
              warm: '#FAF9F5',
              dark: '#EBE7DF',
              border: '#DDD8CE',
            },
            tomato: {
              DEFAULT: '#E8412C',
              hover: '#D43420',
              light: '#FCECE9',
              border: '#C9311E',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F7F5EF;
      color: #20261B;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #9CAF88;
      border-radius: 4px;
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }
    .touch-none {
      touch-action: none;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden selection:bg-sage/30">

  <!-- HEADER GỌN GÀNG -->
  <header class="shrink-0 bg-[#F7F5EF]/95 backdrop-blur-md border-b-2 border-offwhite-border px-3.5 py-2 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-tomato" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="4" rx="1"/>
          <path d="M12 8v13"/>
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
        </svg>
        <h1 class="text-base font-bold tracking-tight text-sage-900 leading-tight">Sổ Quà Ba Lan</h1>
      </div>
      <button onclick="openAddModal()" class="btn-bounce bg-tomato hover:bg-tomato-hover text-white font-bold px-3 py-1.5 rounded-xl shadow-xs text-xs flex items-center gap-1.5 border-2 border-tomato-border transition duration-150">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M12 5v14"/>
        </svg>
        <span>Tặng quà</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER (VỪA KHÍT MÀN HÌNH ĐIỆN THOẠI, KHÔNG PHẢI TRƯỢT LÊN XUỐNG) -->
  <main class="max-w-md mx-auto w-full px-3 py-2 flex-1 flex flex-col justify-between overflow-hidden space-y-2">

    <!-- DASHBOARD THỐNG KÊ (THANH COMPACT TIẾT KIỆM KHÔNG GIAN, KHÔNG CHÚ THÍCH) -->
    <div class="grid grid-cols-3 gap-1.5 shrink-0">
      <!-- Đã tặng -->
      <div onclick="setFilter('gifted')" class="cursor-pointer bg-white border-2 border-sage rounded-xl p-1.5 text-center shadow-xs btn-bounce transition hover:bg-sage-50">
        <div class="text-[10px] font-bold text-sage-700 flex items-center justify-center gap-1">
          <svg class="w-3 h-3 text-sage-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Đã tặng</span>
        </div>
        <div id="stat-gifted" class="text-xl font-black text-sage-900 leading-tight mt-0.5">0</div>
      </div>

      <!-- Chuẩn bị tặng -->
      <div onclick="setFilter('preparing')" class="cursor-pointer bg-white border-2 border-tomato/40 rounded-xl p-1.5 text-center shadow-xs btn-bounce transition hover:bg-tomato-light">
        <div class="text-[10px] font-bold text-tomato flex items-center justify-center gap-1">
          <svg class="w-3 h-3 text-tomato" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>Chuẩn bị</span>
        </div>
        <div id="stat-preparing" class="text-xl font-black text-tomato leading-tight mt-0.5">0</div>
      </div>

      <!-- Chưa tặng / Còn tồn kho -->
      <div onclick="switchTab('categories')" class="cursor-pointer bg-white border-2 border-offwhite-border rounded-xl p-1.5 text-center shadow-xs btn-bounce transition hover:bg-offwhite-warm">
        <div class="text-[10px] font-bold text-sage-800 flex items-center justify-center gap-1">
          <svg class="w-3 h-3 text-sage-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
          </svg>
          <span>Chưa tặng</span>
        </div>
        <div id="stat-remaining" class="text-xl font-black text-sage-900 leading-tight mt-0.5">148</div>
      </div>
    </div>

    <!-- TABS ĐIỀU HƯỚNG GỌN (Người nhận -> Nhóm quà -> Kho tổng) -->
    <div class="flex bg-offwhite-dark p-0.5 rounded-xl border border-offwhite-border gap-1 text-center shrink-0">
      <button id="tab-recipients-btn" onclick="switchTab('recipients')" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white text-sage-900 shadow-xs flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Người nhận (<span id="recipient-count">0</span>)</span>
      </button>
      <button id="tab-categories-btn" onclick="switchTab('categories')" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-sage-700 hover:text-sage-900 flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
        </svg>
        <span>Nhóm quà (6)</span>
      </button>
      <button id="tab-inventory-btn" onclick="switchTab('inventory')" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-sage-700 hover:text-sage-900 flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
        </svg>
        <span>Kho tổng (49)</span>
      </button>
    </div>

    <!-- TAB 1: DANH SÁCH NGƯỜI NHẬN (HIỂN THỊ ĐẦU TIÊN) -->
    <section id="tab-recipients" class="flex-1 flex flex-col overflow-hidden space-y-2">
      <!-- Tìm kiếm & Lọc trạng thái -->
      <div class="flex items-center gap-1.5 shrink-0">
        <div class="relative flex-1">
          <input type="text" id="search-input" oninput="renderRecipients()" placeholder="Tìm tên người nhận..." class="w-full bg-white border-2 border-offwhite-border rounded-xl px-2.5 py-1.5 pl-8 text-xs focus:outline-none focus:border-sage placeholder-sage-700/50 text-sage-900 font-bold">
          <svg class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-sage-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
        </div>
        <select id="status-filter" onchange="setFilter(this.value)" class="bg-white border-2 border-offwhite-border rounded-xl px-2 py-1.5 text-[11px] font-bold text-sage-900 focus:outline-none focus:border-sage">
          <option value="all">Tất cả</option>
          <option value="preparing">Chuẩn bị</option>
          <option value="gifted">Đã tặng</option>
          <option value="pending">Chưa tặng</option>
        </select>
      </div>

      <!-- Danh sách card người nhận (cuộn độc lập trong tab) -->
      <div id="recipients-list" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-0.5">
        <!-- Render bằng JavaScript -->
      </div>

      <!-- Trạng thái trống -->
      <div id="empty-recipients" class="hidden text-center py-6 px-3 bg-white/80 border-2 border-dashed border-sage-300 rounded-2xl shrink-0">
        <svg class="w-10 h-10 mx-auto mb-1.5 text-sage-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        <h3 class="text-xs font-bold text-sage-900">Chưa có người nhận nào</h3>
        <p class="text-[10px] text-sage-700 mt-0.5 mb-2.5">Bấm nút bên dưới để chọn quà tặng cho người quen nhé!</p>
        <button onclick="openAddModal()" class="bg-tomato hover:bg-tomato-hover text-white font-bold px-3 py-1.5 rounded-xl border border-tomato-border shadow-xs text-xs btn-bounce inline-flex items-center gap-1 transition duration-150">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5v14"/>
          </svg>
          <span>Thêm người nhận</span>
        </button>
      </div>
    </section>

    <!-- TAB 2: CÁC NHÓM QUÀ TẶNG (6 CARD NHỎ GỌN) -->
    <section id="tab-categories" class="hidden flex-1 flex flex-col justify-between overflow-hidden">
      <!-- LƯỚI 6 CARD NHỎ GỌN (2 CỘT x 3 DÒNG) - VỪA KHÍT MÀN HÌNH ĐIỆN THOẠI -->
      <div id="category-cards-grid" class="grid grid-cols-2 gap-2 flex-1">
        <!-- Render 6 card động qua JavaScript -->
      </div>
    </section>

    <!-- TAB 3: KHO QUÀ TỔNG HỢP (49 LOẠI) -->
    <section id="tab-inventory" class="hidden flex-1 flex flex-col overflow-hidden space-y-2">
      <div class="flex items-center justify-between shrink-0">
        <span class="text-[11px] font-bold text-sage-900">Chi tiết 49 loại quà trong kho:</span>
        <select id="category-filter" onchange="renderInventory()" class="bg-white border-2 border-offwhite-border rounded-xl px-2 py-0.5 text-[11px] font-bold text-sage-900 focus:outline-none focus:border-sage">
          <option value="all">Tất cả nhóm</option>
          <option value="Nước hoa">Nước hoa (41)</option>
          <option value="Dưỡng da">Dưỡng da (6)</option>
          <option value="Phấn">Phấn (12)</option>
          <option value="Nền & Che khuyết điểm">Nền & CKĐ (13)</option>
          <option value="Son môi">Son môi (12)</option>
          <option value="Chocolate">Chocolate (64)</option>
        </select>
      </div>
      <div id="inventory-list" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-0.5">
        <!-- Render danh sách tồn kho -->
      </div>
    </section>

  </main>

  <!-- MODAL BOTTOM-SHEET: CHI TIẾT QUÀ KHI CLICK VÀO TỪNG CARD NHÓM QUÀ -->
  <div id="category-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-offwhite w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border-t-4 sm:border-4 border-sage shadow-2xl max-h-[85vh] flex flex-col overflow-hidden">
      <!-- Sheet Header -->
      <div id="category-modal-header" class="px-3.5 py-2.5 border-b-2 border-offwhite-border bg-white flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span id="cat-modal-emoji" class="text-sage-700 flex items-center justify-center w-7 h-7 bg-sage-100 rounded-lg shrink-0">
            <svg class="w-4 h-4 text-sage-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="8" width="18" height="4" rx="1"/>
              <path d="M12 8v13"/>
              <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
              <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
            </svg>
          </span>
          <div class="truncate">
            <div class="flex items-center gap-1.5">
              <h3 id="cat-modal-title" class="text-sm font-bold text-sage-900 leading-tight">Chi tiết nhóm quà</h3>
              <span id="cat-modal-badge" class="px-1.5 py-0.2 rounded-full text-[10px] font-black border"></span>
            </div>
            <p id="cat-modal-subtitle" class="text-[10px] text-sage-700 font-semibold"></p>
          </div>
        </div>
        <button onclick="closeCategoryModal()" class="text-sage-700 hover:text-sage-900 p-1 btn-bounce" aria-label="Đóng">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- Sheet Items List (Scrollable) -->
      <div id="category-modal-items" class="p-3 space-y-2 overflow-y-auto custom-scroll flex-1">
        <!-- Render các món cụ thể có icon minh họa ảnh thật -->
      </div>

      <!-- Sheet Footer -->
      <div class="bg-offwhite-dark px-3 py-2 border-t border-offwhite-border flex justify-between items-center text-xs">
        <span class="text-[10px] text-sage-700 font-semibold flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-sage-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <span>Chạm ảnh để phóng to soi chữ</span>
        </span>
        <button onclick="closeCategoryModal()" class="px-3 py-1 bg-white border border-offwhite-border rounded-xl font-bold text-sage-900 text-xs btn-bounce">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: PHÓNG TO HÌNH ẢNH (ZOOM LIGHTBOX ĐỂ SOI CHỮ SẢN PHẨM RÕ NÉT) -->
  <div id="image-zoom-modal" class="fixed inset-0 z-[60] bg-black/90 backdrop-blur-md hidden flex flex-col justify-between select-none">
    <!-- Top Bar -->
    <div class="px-4 py-2.5 bg-black/50 border-b border-white/10 flex items-center justify-between text-white shrink-0 z-10">
      <div class="min-w-0 pr-2">
        <h3 id="zoom-image-title" class="text-xs sm:text-sm font-bold truncate text-sage-300">Tên sản phẩm</h3>
        <p id="zoom-image-category" class="text-[10px] text-white/70">Chạm/cuộn phóng to • Kéo để soi nhãn chữ</p>
      </div>
      <button onclick="closeImageZoom()" class="bg-white/20 hover:bg-white/30 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-base btn-bounce shrink-0" aria-label="Đóng">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- Viewport Area (Kéo, Zoom, Xoay) -->
    <div id="zoom-viewport" class="flex-1 relative overflow-hidden flex items-center justify-center touch-none cursor-grab active:cursor-grabbing">
      <img id="zoom-target-image" src="" alt="Zoom preview" class="max-h-[75vh] max-w-[90vw] object-contain transition-transform duration-100 ease-out drop-shadow-2xl">
    </div>

    <!-- Bottom Toolbar -->
    <div class="px-3 py-2 bg-black/60 border-t border-white/10 flex items-center justify-between gap-1.5 shrink-0 z-10 text-white text-xs">
      <div class="flex items-center gap-1">
        <button onclick="changeZoom(-0.3)" class="bg-white/15 hover:bg-white/25 px-2.5 py-1.5 rounded-xl font-bold btn-bounce flex items-center gap-1.5 text-xs">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/>
          </svg>
          <span>Thu nhỏ</span>
        </button>
        <span id="zoom-level-text" class="px-2 py-1 bg-white/10 rounded-lg font-bold text-[11px] min-w-[44px] text-center">100%</span>
        <button onclick="changeZoom(0.3)" class="bg-white/15 hover:bg-white/25 px-2.5 py-1.5 rounded-xl font-bold btn-bounce flex items-center gap-1.5 text-xs">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/>
          </svg>
          <span>Phóng to</span>
        </button>
      </div>

      <div class="flex items-center gap-1">
        <button onclick="rotateZoomImage()" class="bg-sage hover:bg-sage-600 text-white font-bold px-2.5 py-1.5 rounded-xl btn-bounce flex items-center gap-1.5 text-xs">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
          </svg>
          <span>Xoay 90°</span>
        </button>
        <button onclick="resetZoom()" class="bg-white/15 hover:bg-white/25 px-2 py-1.5 rounded-xl font-bold btn-bounce text-xs flex items-center justify-center" title="Khôi phục">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: THÊM / SỬA NGƯỜI NHẬN QUÀ -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-offwhite w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border-t-4 sm:border-4 border-sage shadow-2xl max-h-[88vh] flex flex-col overflow-hidden">
      
      <!-- Modal Header -->
      <div class="bg-white px-3.5 py-2.5 border-b-2 border-offwhite-border flex items-center justify-between">
        <h3 id="modal-title" class="text-sm font-bold text-sage-900">
          Thêm người nhận
        </h3>
        <button onclick="closeModal()" class="text-sage-700 hover:text-sage-900 p-1 btn-bounce" aria-label="Đóng">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->

    if (storedInv && Array.isArray(storedInv) && storedInv.length === INITIAL_INVENTORY.length) {

    function escapeHtml(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function saveData() {
      localStorage.setItem('poland_gifts_inventory', JSON.stringify(inventory));
      localStorage.setItem('poland_gifts_recipients', JSON.stringify(recipients));
      updateStats();
      renderCategoryCards();
      renderRecipients();
      renderInventory();
    }

    function updateStats() {
      let giftedCount = 0;
      let preparingCount = 0;
      let pendingCount = 0;

      recipients.forEach(r => {
        (r.items || []).forEach(it => {
          const qty = parseInt(it.qty) || 0;
          if (it.status === 'gifted') {
            giftedCount += qty;
          } else if (it.status === 'preparing') {
            preparingCount += qty;
          } else if (it.status === 'pending') {
            pendingCount += qty;
          }
        });
      });

      const totalInventory = inventory.reduce((sum, item) => sum + item.total, 0); // 148
      const totalNotGiftedYet = totalInventory - giftedCount;

      document.getElementById('stat-gifted').innerText = giftedCount;
      document.getElementById('stat-preparing').innerText = preparingCount;
      document.getElementById('stat-remaining').innerText = totalNotGiftedYet;
      document.getElementById('recipient-count').innerText = recipients.length;
    }

    function switchTab(tab) {
      currentTab = tab;
      const catTab = document.getElementById('tab-categories');
      const recTab = document.getElementById('tab-recipients');
      const invTab = document.getElementById('tab-inventory');

      const catBtn = document.getElementById('tab-categories-btn');
      const recBtn = document.getElementById('tab-recipients-btn');
      const invBtn = document.getElementById('tab-inventory-btn');

      catTab.classList.add('hidden');
      recTab.classList.add('hidden');
      invTab.classList.add('hidden');

      const inactiveClass = 'flex-1 py-1 text-xs font-bold rounded-lg transition text-sage-700 hover:text-sage-900';
      const activeClass = 'flex-1 py-1 text-xs font-bold rounded-lg transition bg-white text-sage-900 shadow-xs';

      catBtn.className = inactiveClass;
      recBtn.className = inactiveClass;
      invBtn.className = inactiveClass;

      if (tab === 'categories') {
        catTab.classList.remove('hidden');
        catBtn.className = activeClass;
        renderCategoryCards();
      } else if (tab === 'recipients') {
        recTab.classList.remove('hidden');
        recBtn.className = activeClass;
        renderRecipients();
      } else {
        invTab.classList.remove('hidden');
        invBtn.className = activeClass;
        renderInventory();
      }
    }

      currentFilter = status;
      document.getElementById('status-filter').value = status;

      renderRecipients();

    // RENDER LƯỚI 6 CARD NHỎ GỌN (VỪA KHÍT MÀN HÌNH ĐIỆN THOẠI)
    function renderCategoryCards() {
      const grid = document.getElementById('category-cards-grid');

      const assignedMap = {};
      recipients.forEach(r => {
        (r.items || []).forEach(it => {
          assignedMap[it.giftId] = (assignedMap[it.giftId] || 0) + (parseInt(it.qty) || 0);
        });
      });

      grid.innerHTML = SORTED_CATEGORY_NAMES.map(catName => {
        const meta = CATEGORY_META[catName];
        const allItems = inventory.filter(i => i.category === catName).sort((a, b) => (b.priceValue || 0) - (a.priceValue || 0));
        const totalItemsCount = allItems.reduce((sum, i) => sum + i.total, 0);
        const totalAssignedCount = allItems.reduce((sum, i) => sum + (assignedMap[i.id] || 0), 0);
        const totalRemainCount = Math.max(0, totalItemsCount - totalAssignedCount);

        const stockText = totalRemainCount === totalItemsCount 
          ? `${totalItemsCount} sản phẩm`
          : `Còn ${totalRemainCount}/${totalItemsCount} sp`;

        return `
          <div onclick="openCategoryModal('${catName}')" class="cursor-pointer bg-white border-2 border-offwhite-border rounded-2xl p-3 flex flex-col items-center justify-center text-center shadow-xs btn-bounce transition hover:border-sage select-none">

            <h3 class="font-black text-base sm:text-lg text-sage-900 tracking-wide leading-tight mb-1">
              ${catName}
            </h3>

            <!-- SỐ LOẠI SẢN PHẨM: MÀU XANH SAGE RÕ NÉT -->
            <div class="text-xs sm:text-sm font-bold text-[#507A38] leading-tight">
              ${allItems.length} loại
            </div>

            <!-- TỔNG SỐ LƯỢNG / CÒN LẠI: MÀU ĐỎ TOMATO NỔI BẬT -->
            <div class="text-xs sm:text-sm font-black text-tomato leading-tight mt-1">
              ${stockText}
            </div>

          </div>
        `;
      }).join('');
    }

    // MỞ MODAL XEM CHI TIẾT TỪNG MÓN CỦA NHÓM QUÀ KHI CLICK CARD
    function openCategoryModal(catName) {
      const meta = CATEGORY_META[catName];
      if (!meta) return;

      // Sắp xếp các sản phẩm trong card theo thứ tự giá từ cao xuống thấp
      const allItems = inventory
        .filter(i => i.category === catName)
        .sort((a, b) => (b.priceValue || 0) - (a.priceValue || 0));

      const assignedMap = {};
      const assignedRecipientsMap = {};
      recipients.forEach(r => {
        (r.items || []).forEach(it => {
          const gId = it.giftId;
          const qty = parseInt(it.qty) || 0;
          assignedMap[gId] = (assignedMap[gId] || 0) + qty;
          if (!assignedRecipientsMap[gId]) assignedRecipientsMap[gId] = [];
          assignedRecipientsMap[gId].push(`${r.name} (${qty})`);
        });
      });

      const totalItemsCount = allItems.reduce((sum, i) => sum + i.total, 0);
      const totalAssignedCount = allItems.reduce((sum, i) => sum + (assignedMap[i.id] || 0), 0);
      const totalRemainCount = Math.max(0, totalItemsCount - totalAssignedCount);

      // Thiết lập Header Modal
      document.getElementById('cat-modal-title').innerText = catName;
      document.getElementById('cat-modal-badge').innerText = meta.rankBadge;
      document.getElementById('cat-modal-badge').className = 'px-1.5 py-0.2 rounded-full text-[10px] font-black bg-sage-100 text-sage-900 border border-sage-300';
      document.getElementById('cat-modal-subtitle').innerText = `${allItems.length} loại - ${totalItemsCount} sản phẩm (Còn ${totalRemainCount} món)`;

      const headerEl = document.getElementById('category-modal-header');
      headerEl.className = 'px-3.5 py-2.5 border-b-2 border-offwhite-border bg-white flex items-center justify-between';

      // Render danh sách các món cụ thể với hình ảnh icon chuẩn
      const itemsContainer = document.getElementById('category-modal-items');
      itemsContainer.innerHTML = allItems.map(item => {
        const assigned = assignedMap[item.id] || 0;
        const remain = Math.max(0, item.total - assigned);
        const percent = Math.min(100, Math.round((assigned / item.total) * 100));

        let remainBadge = 'bg-sage-100 text-sage-800 border-sage-300';
        if (remain === 0) remainBadge = 'bg-stone-200 text-stone-600 border-stone-300';
        else if (remain <= 1) remainBadge = 'bg-tomato-light text-tomato border-tomato/30';

        const recList = assignedRecipientsMap[item.id] || [];
        const recText = recList.length > 0 ? `
          <div class="text-[9px] text-sage-700 mt-1 flex items-center gap-1 flex-wrap">

    // ====== TÍNH NĂNG ZOOM HÌNH ẢNH & XOAY ĐỂ ĐỌC CHỮ SẢN PHẨM ======
    let currentZoomScale = 1;
    let currentRotation = 0;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDistance = null;
    let initialPinchScale = 1;

    function openImageZoom(imgSrc, title = '', category = '') {
      const modal = document.getElementById('image-zoom-modal');
      const imgEl = document.getElementById('zoom-target-image');
      document.getElementById('zoom-image-title').innerText = title || 'Ảnh chi tiết sản phẩm';
      document.getElementById('zoom-image-category').innerText = category ? `Nhóm: ${category} • Cuộn/Chạm để phóng to đọc chữ` : 'Cuộn/Chạm để phóng to đọc chữ';
      imgEl.src = imgSrc;
      currentZoomScale = 1;
      currentRotation = 0;
      panX = 0;
      panY = 0;
      applyImageTransform();
      modal.classList.remove('hidden');
    }

    function closeImageZoom() {
      document.getElementById('image-zoom-modal').classList.add('hidden');
    }

    function applyImageTransform() {
      const imgEl = document.getElementById('zoom-target-image');
      if (!imgEl) return;
      imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoomScale}) rotate(${currentRotation}deg)`;
      const levelText = document.getElementById('zoom-level-text');
      if (levelText) levelText.innerText = Math.round(currentZoomScale * 100) + '%';
    }

    function changeZoom(delta) {
      currentZoomScale = Math.max(0.7, Math.min(5, currentZoomScale + delta));
      if (currentZoomScale <= 1) {
        panX = 0;
        panY = 0;
      }
      applyImageTransform();
    }

    function rotateZoomImage() {
      currentRotation = (currentRotation + 90) % 360;
      applyImageTransform();
    }

    function resetZoom() {
      currentZoomScale = 1;
      currentRotation = 0;
      panX = 0;
      panY = 0;
      applyImageTransform();
    }

    // Khởi tạo các sự kiện kéo & zoom đa điểm trên viewport
    window.addEventListener('DOMContentLoaded', () => {
      const viewport = document.getElementById('zoom-viewport');
      if (!viewport) return;

      // Mouse drag pan
      viewport.addEventListener('mousedown', (e) => {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyImageTransform();
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
      });

      // Mouse wheel zoom
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.25 : -0.25;
        changeZoom(delta);
      }, { passive: false });

      // Double-click to zoom
      viewport.addEventListener('dblclick', () => {
        if (currentZoomScale > 1.2) {
          resetZoom();
        } else {
          currentZoomScale = 2.5;
          applyImageTransform();
        }
      });

      // Mobile Touch pan & pinch to zoom
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isPanning = true;
          startX = e.touches[0].clientX - panX;
          startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
          isPanning = false;
          initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialPinchScale = currentZoomScale;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isPanning) {
          panX = e.touches[0].clientX - startX;
          panY = e.touches[0].clientY - startY;
          applyImageTransform();
        } else if (e.touches.length === 2 && initialPinchDistance) {
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scaleRatio = currentDistance / initialPinchDistance;
          currentZoomScale = Math.max(0.7, Math.min(5, initialPinchScale * scaleRatio));
          applyImageTransform();
        }
      }, { passive: true });

      viewport.addEventListener('touchend', () => {
        isPanning = false;
        initialPinchDistance = null;
      });
    });

    function cycleItemStatus(recipientId, itemIndex) {
      const rec = recipients.find(r => r.id === recipientId);
      if (!rec || !rec.items[itemIndex]) return;

      const order = ['preparing', 'gifted', 'pending'];
      const curIdx = order.indexOf(rec.items[itemIndex].status || 'preparing');
      const nextStatus = order[(curIdx + 1) % order.length];
      rec.items[itemIndex].status = nextStatus;

      saveData();
    }

        const catItems = inventory.filter(i => i.category === cat).sort((a, b) => (b.priceValue || 0) - (a.priceValue || 0));
        const itemsOpt = catItems.map(item => {
          const isSelected = parseInt(defaultGiftId) === item.id ? 'selected' : '';
          return `<option value="${item.id}" data-img="${item.image}" ${isSelected}>${item.name}</option>`;
        }).join('');
        return `<optgroup label="${cat}">${itemsOpt}</optgroup>`;
      }).join('');

      const div = document.createElement('div');
      div.id = rowId;
      div.className = 'bg-white p-2 rounded-xl border border-offwhite-border space-y-1.5 relative';
      div.innerHTML = `
        <div class="flex items-center gap-1.5">
          <!-- Icon xem trước quà -->
          <div onclick="openImageZoom(document.getElementById('preview-${rowId}').src, '${escapeHtml(initialGift.name)}')" class="cursor-zoom-in shrink-0" title="Chạm để phóng to xem chữ">
            <img id="preview-${rowId}" src="${initialGift.image}" alt="${initialGift.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239CAF88%22 stroke-width=%222%22><rect x=%223%22 y=%228%22 width=%2218%22 height=%224%22 rx=%221%22/><path d=%22M12 8v13%22/><path d=%22M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7%22/></svg>'" class="w-9 h-9 object-contain rounded-lg border border-offwhite-border bg-offwhite p-0.5 shadow-2xs">
          </div>
          
          <select onchange="updateRowPreview('${rowId}', this)" class="gift-select flex-1 bg-offwhite/50 border border-offwhite-border rounded-lg px-2 py-1 text-xs font-semibold text-sage-900 focus:outline-none focus:border-sage">
            ${optionsHtml}
          </select>
          <button type="button" onclick="document.getElementById('${rowId}').remove()" class="text-tomato hover:text-tomato-hover p-1 rounded-md transition" aria-label="Xóa món">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1 text-[11px]">
            <span class="text-sage-800 font-bold">SL:</span>
            <input type="number" min="1" max="50" value="${qty}" class="gift-qty w-12 bg-offwhite/50 border border-offwhite-border rounded-lg px-1.5 py-0.5 text-xs font-bold text-center text-sage-900">
          </div>
          <div class="flex items-center gap-1 text-[11px] flex-1 justify-end">
            <span class="text-sage-800 font-bold">Trạng thái:</span>
            <select class="gift-status bg-offwhite/50 border border-offwhite-border rounded-lg px-1.5 py-0.5 text-xs font-bold text-sage-900">
              <option value="preparing" ${status === 'preparing' ? 'selected' : ''}>Chuẩn bị</option>
              <option value="gifted" ${status === 'gifted' ? 'selected' : ''}>Đã tặng</option>
              <option value="pending" ${status === 'pending' ? 'selected' : ''}>Chưa tặng</option>
            </select>
          </div>
        </div>
      `;
      container.appendChild(div);
    }

    function updateRowPreview(rowId, selectEl) {
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      const imgPath = selectedOption.getAttribute('data-img');
      const imgEl = document.getElementById('preview-' + rowId);
      if (imgEl && imgPath) {
        imgEl.src = imgPath;
      }
    }

    function saveRecipient() {
      const name = document.getElementById('modal-person-name').value.trim();
      const note = '';

      if (!name) {
        alert('Vui lòng nhập tên người nhận!');
        return;
      }

      const rows = document.querySelectorAll('#modal-gift-rows > div');
      const items = [];

      rows.forEach(r => {
        const giftId = parseInt(r.querySelector('.gift-select').value);
        const qty = parseInt(r.querySelector('.gift-qty').value) || 1;
        const status = r.querySelector('.gift-status').value;
        const gift = inventory.find(i => i.id === giftId);

        if (gift) {
          items.push({
            giftId: gift.id,
            giftName: gift.name,
            qty: qty,
            status: status,
            image: gift.image
          });
        }
      });

      if (editingRecipientId) {
        const idx = recipients.findIndex(r => r.id === editingRecipientId);
        if (idx !== -1) {
          recipients[idx] = { id: editingRecipientId, name, note, items };
        }
      } else {
        recipients.push({
          id: 'rec-' + Date.now(),
          name,
          note,
          items
        });
      }

      saveData();
      closeModal();
      switchTab('recipients');
    }

    function deleteRecipient(id) {
      if (confirm('Đại ca có chắc muốn xóa người nhận này khỏi danh sách không?')) {
        recipients = recipients.filter(r => r.id !== id);
        saveData();
      }
    }

    // KHỞI TẠO BAN ĐẦU
    updateStats();
    switchTab('recipients');
  </script>
</body>
</html>
